name: Lint + Test + Bump version + Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  bump:
    needs: [lint, test]
    uses: MaxiGarcia13/gh-actions/.github/workflows/bump-version.yml@main

  deploy:
    needs: bump
    uses: MaxiGarcia13/gh-actions/.github/workflows/deploy-to-vercel.yml@main
    secrets: inherit
    with:
      deployment_environment: Production
      deployment_url: https://snap-website-api.vercel.app

  release-notes:
    name: Create Release Notes
    if: ${{ needs.bump.outputs.tag != '' }}
    needs: bump
    uses: MaxiGarcia13/gh-actions/.github/workflows/create-release-notes.yml@main
    with:
      tag: ${{ needs.bump.outputs.tag }}
      default_branch: main
